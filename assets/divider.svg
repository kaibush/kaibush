<svg xmlns="http://www.w3.org/2000/svg" width="900" height="28" viewBox="0 0 900 28">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2bd6" stop-opacity="0"/>
      <stop offset=".2" stop-color="#ff2bd6"/>
      <stop offset=".5" stop-color="#00f5d4"/>
      <stop offset=".8" stop-color="#4cc9f0"/>
      <stop offset="1" stop-color="#4cc9f0" stop-opacity="0"/>
