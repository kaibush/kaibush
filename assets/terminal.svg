  <text x="36" y="238" class="t" fill="#00f5d4">[  OK  ] curiosity.service is active (running)</text>
  <text x="36" y="270" class="t" fill="#e6edf3">kaibush@github:~$ echo Hello, World!</text>
  <text x="36" y="302" class="t" fill="#9ecfc4">Hello, World!</text>
  <text x="36" y="334" class="t" fill="#e6edf3">kaibush@github:~$ ./profile --mode=hacker --theme=neon</text>
  <text x="36" y="366" class="t" fill="#9ecfc4">booting personal node...</text>
